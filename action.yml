name: "Greenlight"
description: "Infers what a pull request is meant to do, drives its Vercel preview in a browser, and posts what it found."
branding:
  icon: "check-circle"
  color: "green"

# The two required inputs come as a pair: the key must belong to the provider
# named in `model`. Three setups, as they appear in a workflow's `with:` block
# (the model id is whatever the provider calls it):
#
#   # OpenAI (key from platform.openai.com, "sk-...")
#   llm-api-key: ${{ secrets.OPENAI_API_KEY }}
#   model: openai/<model-id>
#
#   # Anthropic (key from console.anthropic.com, "sk-ant-...")
#   llm-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#   model: anthropic/<model-id>
#
#   # Fireworks, one of the OpenAI-compatible hosts (key from fireworks.ai, "fw_...")
#   llm-api-key: ${{ secrets.FIREWORKS_API_KEY }}
#   model: fireworks/<model-id>
inputs:
  llm-api-key:
    description: >-
      API key for the LLM provider named in `model`: an OpenAI key for
      "openai/…", an Anthropic key for "anthropic/…", a Fireworks key for
      "fireworks/…". Drives both test-plan generation and the browser run.
    required: true
  model:
    description: >-
      Model to run, as "provider/model". The provider is one of "anthropic",
      "openai", "google" (native SDKs) or "fireworks", "together",
      "openrouter" (OpenAI-compatible hosts), and the model id is whatever
      that provider calls it. Any capable general-purpose model works; the
      choice is yours. No default: the run fails unless you name one.
    required: true
  vercel-bypass-secret:
    description: >-
      Vercel "Protection Bypass for Automation" secret. Only needed when preview
      deployments are protected — which is the default on Vercel Pro/Team.
    required: false
    default: ""
  executor-model:
    description: >-
      Override the model that drives and judges browser steps; same
      "provider/model" syntax. Defaults to `model`. On the generic
      OpenAI-compatible route Stagehand only enforces its act/extract schemas
      for a handful of open-model families; Greenlight warns, and names them,
      when the model you set here is not one of them. Native providers
      (anthropic, openai, google) have no such constraint.
    required: false
    default: ""
  visual-judge-model:
    description: >-
      Model that re-judges an item from a screenshot when the DOM alone can't
      settle it (a highlight with no aria state, a purely visual change); same
      "provider/model" syntax. Left unset it uses a model on the provider you
      already run: `executor-model` on anthropic/openai/google, a
      vision-capable model on fireworks. On together/openrouter it falls back
      to `executor-model` too, but an unnamed judge there can only pass an item,
      never fail one — name a vision model here to give it the final word.
      Set to "off" to skip the escalation and leave those items inconclusive.
    required: false
    default: ""
  pause-timeout-minutes:
    description: >-
      How long the run waits when someone unchecks the "Run these checks" box on
      the plan comment, before giving up and ending quietly. The run is the only
      thing still listening for that box, so it stays alive to see it come back
      — which costs runner minutes, but only when a human actually paused it. A
      normal run never waits here at all.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    # `required: true` is not enforced for composite actions, and a workflow
    # referencing a secret that was never created passes an empty string — fail
    # loudly here rather than running a pipeline that can only stay silent.
    - name: Verify required inputs
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        MODEL: ${{ inputs.model }}
      run: |
        if [ -z "$LLM_API_KEY" ]; then
          echo "::error::llm-api-key is empty. Add your LLM provider's API key to the repository's Actions secrets and pass it to this step via the llm-api-key input. (Note: repository secrets are not available to workflows triggered from forks.)"
          exit 1
        fi
        if [ -z "$MODEL" ]; then
          echo "::error::model is empty. Name the model to run as \"provider/model\", where provider is one of anthropic, openai, google, fireworks, together, openrouter. There is no default; the key you supply must belong to the provider you name."
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install Greenlight
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile

    # Stagehand's local mode launches Chrome through chrome-launcher, which finds
    # a browser via CHROME_PATH, then `which google-chrome|chromium`, then
    # .desktop entries — it never looks in Playwright's cache. So: reuse whatever
    # the runner image already ships, and only download when there is nothing.
    - name: Resolve a browser
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
        if [ -z "$CHROME_PATH" ]; then
          echo "no system Chrome — downloading one"
          npx playwright install --with-deps chromium
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x | head -1)"
        fi
        if [ -z "$CHROME_PATH" ]; then
          echo "could not resolve a Chrome binary" >&2
          exit 1
        fi
        echo "using $CHROME_PATH"
        echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

    - name: Run Greenlight
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx tsx src/actionMain.ts
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # The runner is the browser host: Chrome runs on the runner itself, so
        # the Action needs no browser service or account of its own.
        GREENLIGHT_LOCAL_BROWSER: "1"
        # No display on a runner; rrweb records the DOM, so nothing is lost.
        GREENLIGHT_HEADLESS: "1"
        GREENLIGHT_LLM_API_KEY: ${{ inputs.llm-api-key }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        GREENLIGHT_MODEL: ${{ inputs.model }}
        GREENLIGHT_EXECUTOR_MODEL: ${{ inputs.executor-model }}
        GREENLIGHT_VISUAL_JUDGE_MODEL: ${{ inputs.visual-judge-model }}
        GREENLIGHT_PAUSE_TIMEOUT_MS: ${{ fromJSON(inputs.pause-timeout-minutes) * 60000 }}
        GREENLIGHT_REPLAY_DIR: ${{ runner.temp }}/greenlight-replay
        # Replay images stay inlined (the config default): a replay that links
        # to a protected or torn-down preview renders blank for exactly the
        # people who open it.

    # One self-contained HTML file: download, open, watch. Uploaded even when the
    # run logged an error, since a recording of a broken run is the useful part.
    - name: Upload session replay
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: greenlight-replay-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/greenlight-replay
        # A replay is only interesting while the PR is open, and the repo
        # default (90 days on most repos) would bill 6x the storage for it.
        retention-days: 14
        if-no-files-found: ignore
